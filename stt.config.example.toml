[hotkeys]
# One key only. Letters/numbers are not allowed.
# Valid: right_option, left_option, f18, space
push_to_talk = "right_option"

# Two or three keys joined with "+". Use exact lowercase names.
# Valid: left_option+left_command, right_command+right_shift+space
# Toggle fires after a clean exact-key tap; extra keys cancel that tap.
toggle = "left_option+left_command"

# Supported modifiers:
# left_command, right_command, left_option, right_option
# left_control, right_control, left_shift, right_shift
#
# Supported keys:
# space, enter, escape, tab, backspace, delete
# up, down, left, right, f1 ... f20
# a ... z, 0 ... 9 (toggle only)
#
# Avoid Option + letter/number combos; macOS may turn them into special characters.
# Not supported: fn, globe

[settings]
# Play a sound when transcribed text is pasted. true or false.
sounds = true

# Pause length in seconds that separates utterances, used for voice-command
# boundaries like "scratch that". A number greater than 0, at most 10.
utterance_gap = 0.7

# Noise reduction before transcription. "auto" fires only on noisy clips,
# "on" always, "off" never.
denoise = "auto"

# Microphone: a device index or a device name (substring, case-insensitive).
# Omit the key entirely to use the macOS default input.
# List devices: venv/bin/python -c "import sounddevice as sd; print(sd.query_devices())"
# input_device = 1
# input_device = "MacBook Air Microphone"
